<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kittisak | Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome Social Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: 'Prompt', sans-serif; }

    @keyframes float-slow {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(40px, -30px) scale(1.1); }
    }
    .animate-blob-1 { animation: float-slow 10s infinite ease-in-out; }

    .bg-grid-pattern {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    }

    .glass-nav {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
    }

    .typing-effect::after {
      content: '|';
      animation: blink 1s infinite;
      color: #22d3ee;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden selection:bg-cyan-500 selection:text-slate-950 relative">

      </a>
      <ul class="flex space-x-8 text-sm md:text-base font-medium">

        </div>

        <!-- Social Media Icons (2 ไอคอน: Facebook & Instagram) + Action Buttons -->
        <div class="pt-2 flex flex-wrap items-center justify-center md:justify-start gap-4">

          <div class="flex items-center space-x-3">
            <!-- Facebook -->
            <a href="https://www.facebook.com/kittisak.wanla.2024" target="_blank" rel="noopener noreferrer"

          <img src="images/profile.jpg" alt="Kittisak Profile" class="w-full h-auto object-cover group-hover:scale-103 transition-transform duration-500">
